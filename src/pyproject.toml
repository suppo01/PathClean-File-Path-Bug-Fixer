[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pathclean"
version = "0.1.0"
description = "Windows Path Cleaning Engine"
requires-python = ">=3.14"

[tool.setuptools]
py-modules = [
"main",
"detect_static_analysis",
"OpenCode_runner",
"symbolic_class"
]

[project.scripts]
pathclean = "main:main"